name: Deploy to GitHub Pages

# Запускати автоматично при кожному пуші в гілку main
on:
  push:
    branches:
      - main 
      # ⚠️ Важливо: якщо твоя гілка називається master, напиши тут master

permissions:
  contents: write # Дозвіл боту записувати зібраний сайт у гілку gh-pages

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Отримуємо код
        uses: actions/checkout@v4

      - name: ⚙️ Встановлюємо Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Встановлюємо залежності
        run: npm install

      - name: 🔨 Білдимо проєкт
        run: npm run build

      - name: 🚀 Деплой на GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build # ⚠️ Якщо ти використовуєш Vite замість Create React App, заміни ./build на ./dist