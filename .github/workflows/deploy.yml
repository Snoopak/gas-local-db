name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main # (якщо в тебе гілка master, зміни тут на master)

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Отримуємо код
        uses: actions/checkout@v4

      - name: ⚙️ Встановлюємо Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24' # ⬅️ Оновили версію до 24

      - name: 📦 Встановлюємо залежності
        run: npm install

      - name: 🔨 Білдимо проєкт
        run: CI=false npm run build # ⬅️ Вимкнули суворий режим (CI=false)

      - name: 🚀 Деплой на GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build # Якщо в тебе Vite, заміни на ./dist